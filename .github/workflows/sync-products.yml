name: Sync storefront snapshots

on:
  schedule:
    # Every hour (UTC)
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-products
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Export catalog, delivery and price from Worker
        env:
          VIG_API: https://vigsharm-api.vigsharm.workers.dev
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: node scripts/export-products-snapshot.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/delivery.json data/price-list.json
          if git diff --staged --quiet; then
            echo "No snapshot changes — skip commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync storefront snapshots (catalog, delivery, price)"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Пуш от GITHUB_TOKEN не запускает Deploy to GitHub Pages.
      # workflow_dispatch от того же токена — запускает.
      # Повтор, если прошлая выкладка этого коммита упала: без новой карточки
      # снимок не меняется, и сайт иначе остаётся на старой версии.
      - name: Deploy Pages unless this commit is already live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD)
          line=$(gh run list --workflow=pages.yml --branch main --limit 30 --json headSha,status,conclusion \
            | jq -r --arg sha "$sha" '
                ([.[] | select(.headSha == $sha)][0]) as $r
                | if $r == null then "none none"
                  else "\($r.status) \($r.conclusion // "none")"
                  end
              ')
          state=${line%% *}
          conclusion=${line#* }
          echo "Pages for $sha: $state $conclusion"
          if [ "$conclusion" = "success" ]; then
            echo "Already on the site"
          elif [ "$state" != "none" ] && [ "$state" != "completed" ]; then
            echo "Deploy already $state — skip"
          else
            gh workflow run pages.yml --ref main
            echo "Dispatched Pages deploy"
          fi
