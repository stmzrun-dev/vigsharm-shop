<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Макеты D · E · F</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#f4f4f6;color:#2a2a32}
    h1{font-size:18px;margin:16px 16px 8px}
    p{margin:0 16px 20px;color:#6f6f78;font-size:14px;max-width:36em}
    .grid{display:grid;gap:16px;padding:0 16px 40px;max-width:1100px}
    @media(min-width:720px){.grid{grid-template-columns:1fr 1fr 1fr}}
    figure{margin:0;background:#fff;border:1px solid #e8e8ec;border-radius:16px;padding:12px}
    figcaption{font-weight:800;margin-bottom:4px;font-size:15px}
    .note{display:block;color:#6f6f78;font-size:13px;margin-bottom:10px;line-height:1.35}
    img{width:100%;height:auto;border-radius:12px;display:block}
  </style>
</head>
<body>
  <h1>Новые стили · D E F</h1>
  <p>A–C не зашли — вот другие три. Смотри на телефоне или тут.</p>
  <div class="grid">
    <figure>
      <figcaption>D · Soft 3D</figcaption>
      <span class="note">Весь экран в языке ваших иконок (фургон, бирка) — без лиц</span>
      <img src="images/mockup-style-D-soft-3d.png" alt="D Soft 3D"/>
    </figure>
    <figure>
      <figcaption>E · Фольга и латекс</figcaption>
      <span class="note">Материал шара крупно: блик, фольга, лента</span>
      <img src="images/mockup-style-E-foil-latex.png" alt="E Foil latex"/>
    </figure>
    <figure>
      <figcaption>F · Радуга-искорки</figcaption>
      <span class="note">Белая база + «всё!» и точечная радуга из логотипа</span>
      <img src="images/mockup-style-F-rainbow-sparks.png" alt="F Rainbow sparks"/>
    </figure>
  </div>
</body>
</html>
