<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Макеты G · H · I</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#f4f4f6;color:#2a2a32}
    h1{font-size:18px;margin:16px 16px 8px}
    p{margin:0 16px 20px;color:#6f6f78;font-size:14px}
    .grid{display:grid;gap:16px;padding:0 16px 40px;max-width:1100px}
    @media(min-width:720px){.grid{grid-template-columns:1fr 1fr 1fr}}
    figure{margin:0;background:#fff;border:1px solid #e8e8ec;border-radius:16px;padding:12px}
    figcaption{font-weight:800;margin-bottom:4px}
    .note{display:block;color:#6f6f78;font-size:13px;margin-bottom:10px}
    img{width:100%;border-radius:12px;display:block}
  </style>
</head>
<body>
  <h1>Стили G · H · I</h1>
  <p>Ещё три направления.</p>
  <div class="grid">
    <figure>
      <figcaption>G · Стена из шаров</figcaption>
      <span class="note">Hero = фото арки/стены на весь экран</span>
      <img src="images/mockup-style-G-balloon-wall.png" alt="G"/>
    </figure>
    <figure>
      <figcaption>H · Ателье</figcaption>
      <span class="note">Мастерская: ленты, стол, рукоделие</span>
      <img src="images/mockup-style-H-atelier.png" alt="H"/>
    </figure>
    <figure>
      <figcaption>I · Плоские фигуры</figcaption>
      <span class="note">Иллюстрации-формы без лиц</span>
      <img src="images/mockup-style-I-flat-shapes.png" alt="I"/>
    </figure>
  </div>
</body>
</html>
