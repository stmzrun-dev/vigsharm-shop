<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Макеты по референсам</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#f4f4f6;color:#2a2a32}
    h1{font-size:18px;margin:16px}
    p{margin:0 16px 16px;color:#6f6f78;font-size:14px}
    figure{margin:0 16px 24px;background:#fff;border:1px solid #e8e8ec;border-radius:16px;padding:12px;max-width:1100px}
    figcaption{font-weight:800;margin-bottom:8px}
    img{width:100%;border-radius:12px;display:block}
  </style>
</head>
<body>
  <h1>По твоим референсам</h1>
  <p>1 — пастель soft-3D. 2 — белая витрина с фото-героями.</p>
  <figure>
    <figcaption>1 · Пастель soft-3D</figcaption>
    <img src="images/mockup-ref-pastel-soft3d.png" alt="Пастель soft-3D"/>
  </figure>
  <figure>
    <figcaption>2 · Белая витрина</figcaption>
    <img src="images/mockup-ref-white-showcase.png" alt="Белая витрина"/>
  </figure>
</body>
</html>
