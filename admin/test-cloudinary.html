<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Test Cloudinary Upload</title>
<style>
body { font-family: system-ui; max-width: 800px; margin: 50px auto; padding: 20px; }
.section { margin: 30px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
button { background: #2ecc71; color: white; border: none; cursor: pointer; font-weight: bold; }
button:hover { background: #27ae60; }
.log { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 4px; font-family: monospace; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
.error { background: #ffe6e6; color: #c0392b; }
.success { background: #d4edda; color: #155724; }
h2 { margin-top: 0; }
</style>
</head>
<body>

<h1>🧪 Cloudinary Upload Test</h1>
<p>Проверка настроек и загрузки изображения в Cloudinary.</p>

<div class="section">
  <h2>1️⃣ Настройки Cloudinary</h2>
  <label>Cloud Name:</label>
  <input type="text" id="cloudName" placeholder="dxxxxx"/>
  
  <label>Upload Preset (unsigned):</label>
  <input type="text" id="uploadPreset" placeholder="vigsharm_unsigned"/>
  
  <button onclick="saveSettings()">💾 Сохранить настройки</button>
  <button onclick="loadSettings()">📥 Загрузить из localStorage</button>
</div>

<div class="section">
  <h2>2️⃣ Загрузка тестового изображения</h2>
  <input type="file" id="fileInput" accept="image/*"/>
  <button onclick="testUpload()">🚀 Загрузить в Cloudinary</button>
</div>

<div class="section">
  <h2>3️⃣ Результат</h2>
  <div id="log" class="log">Ожидание действий...</div>
</div>

<script>
const log = (msg, type = 'info') => {
  const logEl = document.getElementById('log');
  const timestamp = new Date().toLocaleTimeString();
  logEl.className = `log ${type}`;
  logEl.textContent = `[${timestamp}] ${msg}\n\n${logEl.textContent}`;
};

function saveSettings() {
  const cloudName = document.getElementById('cloudName').value.trim();
  const uploadPreset = document.getElementById('uploadPreset').value.trim();
  
  if (!cloudName || !uploadPreset) {
    log('❌ Заполните оба поля!', 'error');
    return;
  }
  
  const settings = {
    cloudinaryCloudName: cloudName,
    cloudinaryUploadPreset: uploadPreset,
    workerUrl: 'https://vigsharm-api.vigsharm.workers.dev'
  };
  
  localStorage.setItem('vigsharm_admin_settings', JSON.stringify(settings));
  log('✅ Настройки сохранены в localStorage', 'success');
}

function loadSettings() {
  try {
    const saved = localStorage.getItem('vigsharm_admin_settings');
    if (!saved) {
      log('⚠️ Настройки не найдены в localStorage', 'error');
      return;
    }
    
    const settings = JSON.parse(saved);
    document.getElementById('cloudName').value = settings.cloudinaryCloudName || '';
    document.getElementById('uploadPreset').value = settings.cloudinaryUploadPreset || '';
    
    log(`✅ Настройки загружены:\nCloud Name: ${settings.cloudinaryCloudName}\nUpload Preset: ${settings.cloudinaryUploadPreset}`, 'success');
  } catch (e) {
    log(`❌ Ошибка загрузки: ${e.message}`, 'error');
  }
}

async function testUpload() {
  const cloudName = document.getElementById('cloudName').value.trim();
  const uploadPreset = document.getElementById('uploadPreset').value.trim();
  const fileInput = document.getElementById('fileInput');
  
  if (!cloudName || !uploadPreset) {
    log('❌ Сначала заполните Cloud Name и Upload Preset!', 'error');
    return;
  }
  
  if (!fileInput.files || fileInput.files.length === 0) {
    log('❌ Выберите файл для загрузки!', 'error');
    return;
  }
  
  const file = fileInput.files[0];
  log(`📤 Загрузка файла: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`);
  
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', uploadPreset);
  formData.append('folder', 'vigsharm-products');
  
  log(`🔗 URL: https://api.cloudinary.com/v1_1/${cloudName}/image/upload`);
  log(`📋 Upload Preset: ${uploadPreset}`);
  log(`📁 Folder: vigsharm-products`);
  
  try {
    log('⏳ Отправка запроса...');
    
    const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
      method: 'POST',
      body: formData
    });
    
    log(`📡 HTTP Status: ${response.status} ${response.statusText}`);
    
    const data = await response.json();
    
    if (!response.ok) {
      log(`❌ Cloudinary Error:\n${JSON.stringify(data, null, 2)}`, 'error');
      
      if (data.error?.message?.includes('Upload preset must be whitelisted')) {
        log(`\n💡 РЕШЕНИЕ:\n1. Откройте https://console.cloudinary.com/\n2. Settings → Upload → Upload Presets\n3. Найдите preset "${uploadPreset}"\n4. Убедитесь, что он UNSIGNED\n5. Или создайте новый UNSIGNED preset`, 'error');
      }
      return;
    }
    
    log(`✅ УСПЕШНО!\n\nsecure_url: ${data.secure_url}\npublic_id: ${data.public_id}\nwidth: ${data.width}x${data.height}\nformat: ${data.format}`, 'success');
    
    console.log('CLOUDINARY UPLOAD SUCCESS');
    console.log('secure_url:', data.secure_url);
    console.log('public_id:', data.public_id);
    
  } catch (error) {
    log(`❌ Network Error: ${error.message}`, 'error');
    console.error('Upload error:', error);
  }
}

// Auto-load settings on page load
window.addEventListener('DOMContentLoaded', () => {
  loadSettings();
});
</script>

</body>
</html>
