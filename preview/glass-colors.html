<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Стеклянный баблс — цвета</title>
  <style>
    body { margin: 0; padding: 24px; font: 16px/1.3 Georgia, serif; background: #f3efe9; color: #2b2622; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    figure { margin: 0; background: #fff; border-radius: 16px; overflow: hidden; }
    img { width: 100%; display: block; }
    figcaption { padding: 10px 12px 12px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Стеклянный баблс с надписью</h1>
  <div class="grid">
    <figure><img src="glass/glass-siniy-temnyy-real.jpg?v=bow" alt=""><figcaption>Синий тёмный</figcaption></figure>
    <figure><img src="glass/glass-persikovyy-makarons.jpg?v=bow" alt=""><figcaption>Персиковый Макаронс</figcaption></figure>
    <figure><img src="glass/glass-rozovyy-makarons.jpg?v=bow" alt=""><figcaption>Розовый Макаронс</figcaption></figure>
    <figure><img src="glass/glass-rozovyy-tsiklamen.jpg?v=bow" alt=""><figcaption>Розовый Цикламен</figcaption></figure>
    <figure><img src="glass/glass-rozovyy-svetlyy.jpg?v=bow" alt=""><figcaption>Розовый Светлый</figcaption></figure>
    <figure><img src="glass/glass-malinovyy-retro.jpg?v=bow" alt=""><figcaption>Малиновый Ретро</figcaption></figure>
    <figure><img src="glass/glass-hrom-mindal.jpg?v=bow" alt=""><figcaption>Хром Миндаль</figcaption></figure>
    <figure><img src="glass/glass-kofe.jpg?v=bow" alt=""><figcaption>Кофе</figcaption></figure>
    <figure><img src="glass/glass-zelenyy-krem.jpg?v=bow" alt=""><figcaption>Зелёный Крем</figcaption></figure>
    <figure><img src="glass/glass-kristall-zelenyy.jpg?v=bow" alt=""><figcaption>Кристалл Зелёный</figcaption></figure>
    <figure><img src="glass/glass-hrom-goluboy.jpg?v=bow" alt=""><figcaption>Хром Голубой</figcaption></figure>
    <figure><img src="glass/glass-hrom-sirenevyy.jpg?v=bow" alt=""><figcaption>Хром Сиреневый</figcaption></figure>
    <figure><img src="glass/glass-kristall-fioletovyy.jpg?v=bow" alt=""><figcaption>Кристалл Фиолетовый</figcaption></figure>
  </div>
</body>
</html>
