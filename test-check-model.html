<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Check Edit Models</title>
  <style>
    body { font-family: sans-serif; max-width: 1400px; margin: 40px auto; padding: 20px; background: #0B0E14; color: #F8FAFC; }
    .container { background: #1E293B; padding: 30px; border-radius: 8px; border: 1px solid #334155; }
    .btn { background: #38BDF8; color: #0B0E14; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: #22D3EE; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    .status { margin: 20px 0; padding: 12px; border-radius: 6px; border: 1px solid; }
    .status.info { background: #1E3A5F; border-color: #38BDF8; color: #38BDF8; }
    .status.success { background: #1E3A2F; border-color: #4FD1C5; color: #4FD1C5; }
    .status.error { background: #3A1E1E; border-color: #F97316; color: #F97316; }
    .model-card { margin: 15px 0; padding: 15px; background: #0F172A; border-radius: 6px; border: 1px solid #334155; }
    .model-card h3 { margin-top: 0; color: #38BDF8; }
    .field { margin: 8px 0; padding: 8px; background: #1E293B; border-radius: 4px; }
    .field-name { font-weight: 600; color: #94A3B8; min-width: 180px; display: inline-block; }
    .field-value { color: #4FD1C5; font-family: 'Consolas', monospace; }
    .field-value.false { color: #F97316; }
    .field-value.null { color: #64748B; }
    pre { background: #0B0E14; color: #F8FAFC; padding: 15px; border-radius: 6px; overflow-x: auto; font-size: 12px; border: 1px solid #334155; }
    .summary { display: flex; gap: 20px; margin: 20px 0; }
    .summary-item { flex: 1; padding: 15px; background: #0F172A; border-radius: 6px; border: 1px solid #334155; text-align: center; }
    .summary-item .number { font-size: 32px; font-weight: 700; color: #38BDF8; }
    .summary-item .label { color: #94A3B8; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Check Edit Models (10 моделей)</h1>
    <p>Проверка fields для image/*-edit моделей через Worker API (БЕЗ платной генерации)</p>
    <button id="checkBtn" class="btn" onclick="checkModel()">Проверить все модели</button>
    <div id="status"></div>
    <div id="result"></div>
  </div>
  <script>
    const WORKER_URL = 'http://127.0.0.1:8787';
    
    function log(msg, type = 'info') {
      const s = document.getElementById('status');
      s.className = 'status ' + type;
      s.textContent = msg;
    }
    
    async function checkModel() {
      const btn = document.getElementById('checkBtn');
      const resultDiv = document.getElementById('result');
      btn.disabled = true;
      log('📡 Отправка запроса к Worker...', 'info');
      resultDiv.innerHTML = '';
      try {
        const response = await fetch(WORKER_URL + '/check-model');
        const data = await response.json();
        if (!response.ok || !data.ok) {
          log('❌ Ошибка: ' + (data.error || response.statusText), 'error');
          return;
        }
        log('✅ Получено: ' + data.found_count + ' из ' + data.searched_models + ' моделей', 'success');
        displayResults(data);
      } catch (error) {
        log('❌ ' + error.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }
    
    function displayResults(data) {
      const resultDiv = document.getElementById('result');
      
      // Summary
      let html = '<div class="summary">';
      html += '<div class="summary-item"><div class="number">' + data.total_models + '</div><div class="label">Всего моделей</div></div>';
      html += '<div class="summary-item"><div class="number">' + data.searched_models + '</div><div class="label">Проверено</div></div>';
      html += '<div class="summary-item"><div class="number">' + data.found_count + '</div><div class="label">Найдено</div></div>';
      html += '</div>';
      
      // Каждая модель
      const modelIds = [
        'image/gpt-image-2-edit',
        'image/gpt-image-1.5-edit',
        'image/flux2-pro-edit',
        'image/seedream-5.0-pro-edit',
        'image/seedream-4.5-edit',
        'image/seedream-edit',
        'image/qwen3-pro-edit',
        'image/qwen3-edit',
        'image/qwen-edit',
        'image/grok-edit'
      ];
      
      modelIds.forEach(modelId => {
        const model = data.models[modelId];
        html += '<div class="model-card">';
        html += '<h3>' + modelId + '</h3>';
        
        if (!model) {
          html += '<div class="field"><span class="field-value null">❌ Модель не найдена</span></div>';
        } else {
          // Проверяем ключевые поля для edit
          const fields = model.fields || {};
          html += '<div class="field"><span class="field-name">image (основное):</span><span class="field-value">' + (fields.image ? '✅' : '❌') + '</span></div>';
          html += '<div class="field"><span class="field-name">image2 (второе):</span><span class="field-value ' + (fields.image2 ? '' : 'false') + '">' + (fields.image2 ? '✅' : '❌') + '</span></div>';
          html += '<div class="field"><span class="field-name">reference:</span><span class="field-value ' + (fields.reference ? '' : 'false') + '">' + (fields.reference ? '✅' : '❌') + '</span></div>';
          html += '<div class="field"><span class="field-name">mask:</span><span class="field-value ' + (fields.mask ? '' : 'false') + '">' + (fields.mask ? '✅' : '❌') + '</span></div>';
          html += '<div class="field"><span class="field-name">attachments:</span><span class="field-value ' + (fields.attachments ? '' : 'false') + '">' + (fields.attachments ? '✅' : '❌') + '</span></div>';
          
          // Показываем все fields
          html += '<details style="margin-top: 10px;"><summary style="cursor: pointer; color: #38BDF8;">📋 Все fields</summary>';
          html += '<pre>' + JSON.stringify(fields, null, 2) + '</pre>';
          html += '</details>';
          
          // Полная запись модели
          html += '<details style="margin-top: 10px;"><summary style="cursor: pointer; color: #38BDF8;">📦 Полная запись</summary>';
          html += '<pre>' + JSON.stringify(model.full_record, null, 2) + '</pre>';
          html += '</details>';
        }
        
        html += '</div>';
      });
      
      resultDiv.innerHTML = html;
    }
  </script>
</body>
</html>
