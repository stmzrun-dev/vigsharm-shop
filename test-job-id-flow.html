<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Test Job ID Flow</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    .log { padding: 5px; margin: 2px 0; border-left: 3px solid #888; }
    .log.success { border-color: #4ec9b0; background: #1e3a32; }
    .log.error { border-color: #f48771; background: #3a1e1e; }
    .log.info { border-color: #569cd6; background: #1e2a3a; }
    button { padding: 10px 20px; margin: 10px 5px; font-size: 14px; cursor: pointer; }
    #logs { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>🔍 Test Job ID Flow</h1>
  <p>Проверка передачи job_id от Worker к Frontend и обратно в polling</p>
  
  <button onclick="testJobIdFlow()">▶️ Запустить тест</button>
  <button onclick="clearLogs()">🗑️ Очистить логи</button>
  
  <div id="logs"></div>

  <script>
    const WORKER_URL = 'https://vigsharm-api.vigsharm.workers.dev';
    
    function log(message, type = 'info') {
      const div = document.createElement('div');
      div.className = `log ${type}`;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      document.getElementById('logs').appendChild(div);
      console.log(message);
    }
    
    function clearLogs() {
      document.getElementById('logs').innerHTML = '';
    }
    
    async function testJobIdFlow() {
      clearLogs();
      log('🚀 Starting Job ID Flow Test...', 'info');
      
      try {
        // Step 1: Create job
        log('📤 Step 1: POST /api/studio/process', 'info');
        
        const createResponse = await fetch(`${WORKER_URL}/api/studio/process`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image_url: 'https://res.cloudinary.com/dkrix07fx/image/upload/v1736929648/vigsharm/fguzgnqfabdbjqrywg9m.jpg',
            scene: 'floor',
            prompt: ''
          })
        });
        
        if (!createResponse.ok) {
          throw new Error(`Create failed: ${createResponse.status} ${createResponse.statusText}`);
        }
        
        const createData = await createResponse.json();
        log(`✅ Response received: ${JSON.stringify(createData)}`, 'success');
        
        if (!createData.ok || !createData.job_id) {
          throw new Error('No job_id in response!');
        }
        
        const jobId = createData.job_id;
        log(`✅ Job created with ID: ${jobId}`, 'success');
        
        // Step 2: Poll status with THE SAME job_id
        log(`🔄 Step 2: GET /api/studio/status/${jobId}`, 'info');
        
        for (let i = 0; i < 5; i++) {
          await new Promise(resolve => setTimeout(resolve, 3000));
          
          log(`🔄 Polling attempt ${i + 1}/5 for job: ${jobId}`, 'info');
          
          const statusResponse = await fetch(`${WORKER_URL}/api/studio/status/${jobId}`);
          
          if (!statusResponse.ok) {
            log(`❌ Status check failed: ${statusResponse.status} ${statusResponse.statusText}`, 'error');
            throw new Error(`Status check failed: ${statusResponse.status}`);
          }
          
          const statusData = await statusResponse.json();
          log(`📊 Status for ${jobId}: ${JSON.stringify(statusData)}`, statusData.status === 'done' ? 'success' : 'info');
          
          if (statusData.status === 'done') {
            log(`✅ Job completed! Result URL length: ${statusData.result_url?.length || 0}`, 'success');
            break;
          }
          
          if (statusData.status === 'failed') {
            log(`❌ Job failed!`, 'error');
            break;
          }
        }
        
        log('✅ Test completed successfully!', 'success');
        
      } catch (error) {
        log(`❌ Test failed: ${error.message}`, 'error');
        console.error(error);
      }
    }
  </script>
</body>
</html>
