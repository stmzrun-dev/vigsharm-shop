name = "vigsharm-api"
main = "index.js"
compatibility_date = "2026-09-01"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "vigsharm-db"
database_id = "159f50ce-f89f-4ecb-8c4d-c4796276cfb7"



# Environment variables
[vars]
# Secrets (задаются через wrangler secret put)
# NORDROUTER_API_KEY — ключ NordRouter
# ADMIN_API_KEY — общий ключ авторизации админ-панели (Authorization: Bearer <ключ>).
#   Без него ВСЕ admin-only запросы (создание/изменение/удаление товаров, загрузка фото,
#   ИИ-генерация, Studio Pro) будут отклоняться с 401. Установить: wrangler secret put ADMIN_API_KEY
#   и вписать тот же ключ в админке → Настройки → Admin API Key.
# TELEGRAM_BOT_TOKEN — один токен или несколько через запятую (два сотрудника = два бота).
# TELEGRAM_CHAT_ID — chat_id через запятую, в том же порядке. Если пусто — берём из /start.
# MAX_BOT_TOKEN / MAX_USER_ID — позже, если подключите MAX.
